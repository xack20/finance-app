name: iosApp
options:
  bundleIdPrefix: app.hisaab
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Hisaab
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSFaceIDUsageDescription: "Unlock Hisaab with Face ID."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.hisaab
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        # Simulator builds: no signing needed.
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        # The gradle build-phase reads files outside the Xcode sandbox.
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        # Locate the Kotlin/Native static framework built by gradle.
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../composeApp/build/bin/iosSimulatorArm64/debugFramework"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "ComposeApp"
          # sqlite3_* symbols come from the SQLCipher pod (see Podfile), NOT system libsqlite3.
    preBuildScripts:
      - name: "Build Kotlin/Native framework"
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64
# Explicit SHARED scheme so `xcodebuild -workspace` (CocoaPods) can resolve build destinations.
schemes:
  iosApp:
    build:
      targets:
        iosApp: all
    run:
      config: Debug
    archive:
      config: Debug
